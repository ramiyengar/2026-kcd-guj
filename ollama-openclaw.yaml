apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        resources:
          limits:
            nvidia.com/gpu: 1 # Requests 1 GPU from the Nvidia plugin
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: openclaw
spec:
  selector:
    app: ollama
  ports:
  - port: 11434
    targetPort: 11434
