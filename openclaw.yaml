apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: local-agent
  namespace: openclaw
spec:
  storage:
    persistence:
      enabled: false
  env:
    - name: OPENAI_BASE_URL
      value: "http://ollama-service.openclaw.svc.cluster.local:11434/v1"
    - name: OPENAI_API_KEY
      value: "ollama-local-bypass"
    - name: MODEL_NAME
      value: "gemma4:e4b"
  envFrom:
    - secretRef:
        name: openclaw-api-keys
  config:
    raw:
      models:
        providers:
          google: {}
      agents:
        defaults:
          model:
            primary: "gemma4:e4b"
